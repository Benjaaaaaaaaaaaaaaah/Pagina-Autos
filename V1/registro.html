<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="/TPI Programación/css/loginStyle.css">
    <script src="/TPI Programación/src/registro.js" defer></script>
    <title>Registro Alquiler de Autos</title>
</head>
<body>
    <header id="header-conteiner">
        <i class="fa-solid fa-circle-user"></i>
    </header>
    <div id="login-conteiner">
    <form autocomplete="off">
        <label for="user"><i class="fa-solid fa-user"></i>|<input type="text" name="user" id="user" placeholder="Ingrese Nombre de Usuario"></label>
        <label for="email"><i class="fa-solid fa-envelope"></i>|<input type="email" name="email" id="email" placeholder="Ingrese Email"></label>
        <label for="password"><i class="fa-solid fa-lock"></i>|<input type="password" name="password" id="password" placeholder="Ingrese Contraseña"></label>
        <button type="button" id="btn-register">Registrarse</button>
    </form>
    </div>
</body>
</html>
