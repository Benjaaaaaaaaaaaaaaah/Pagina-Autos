<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="/TPI Programación/css/loginStyle.css">
    <script src="/TPI Programación/src/login.js" defer></script>
    <title>Login Alquiler de Autos</title>
</head>
<body>
    <header id="header-conteiner">
        <i class="fa-solid fa-circle-user"></i>
    </header>
    <div id="login-conteiner">
    <form autocomplete="off">
        <label for="username"><i class="fa-solid fa-user"></i>|<input type="text" name="username" id="username-login" placeholder="Usuario o Email"></label>
        <label for="password"><i class="fa-solid fa-lock"></i>|<input type="password" name="password" id="password-login" placeholder="Contraseña"></label>
        <a href="registro.html" id="registrar">Registrarse</a>
        <button type="button" id="btn-login">Iniciar Sesión</button>
    </form>
    </div>
</body>
</html>
