<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/loginStyle.css">
    <title>Login Alquiler de Autos</title>
</head>
<body>
    <div class="linea-decorativa linea-1"></div>
    <div class="linea-decorativa linea-2"></div>
    
    <header id="contenedor-encabezado">
        <img class="logo-empresa" src="img/fondoBlanco.png" alt="Logo Empresa">
    </header>
    
    <div id="contenedor-login">
        <form id="formLogin" autocomplete="off">
            <h2>Bienvenido</h2>
            
            <div id="mensajeError" style="display: none; background: #ffebee; color: #c62828; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;"></div>
            
            <div class="grupo-entrada">
                <input type="text" name="username" id="usuario-login" placeholder="Usuario o Email" required>
                <i class="fa-solid fa-user"></i>
            </div>
            
            <div class="grupo-entrada">
                <input type="password" name="password" id="contrasena-login" placeholder="Contraseña" required>
                <i class="fa-solid fa-lock"></i>
            </div>
            
            <div class="contenedor-enlace">
                <a href="registro.html" id="enlace-registrar">¿No tienes cuenta? Regístrate</a>
            </div>
            
            <button type="submit" id="btn-login">Iniciar Sesión</button>
        </form>
    </div>

    <script src="src/login.js"></script>
</body>
</html>
